<!DOCTYPE html>
<!--
  PERSONA AI — Behavioral Intelligence & Relationship Analytics Workstation
  OFFLINE SINGLE-FILE BUILD (bundled with esbuild; all CSS inlined).
  Open this file directly in any modern browser — no server, no internet.
  Data is stored locally on this device (IndexedDB / localStorage).
-->
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="PERSONA AI — a private, evidence-based behavioral observation & relationship analytics workstation.">
<title>PERSONA AI · Behavioral Intelligence Workstation</title>
<style>
/* ============================================================
   PERSONA AI — main.css (base + layout)
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--fs);
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

h1,h2,h3,h4,h5 { margin: 0 0 .4em; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; color: var(--text-strong); }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 .8em; }
code { font-family: var(--font-mono); font-size: .85em; background: var(--code-bg); padding: .1em .4em; border-radius: 6px; }

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: var(--fs); color: var(--text); }
::placeholder { color: var(--text-muted); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip-link { position: absolute; left: -999px; top: 0; background: var(--accent); color:#fff; padding: 8px 14px; border-radius: 0 0 8px 0; z-index: 3000; }
.skip-link:focus { left: 0; }

/* ---------- App shell ---------- */
.app-shell { display: flex; height: 100vh; overflow: hidden; }

.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--sidebar-bg);
  transition: transform .28s var(--ease), margin .28s var(--ease);
  z-index: 40;
}

.main-column { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }

/* ---------- Sidebar ---------- */
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.logo-mark { width: 38px; height: 38px; border-radius: 11px; display:grid; place-items:center; color:#fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: var(--shadow-sm); }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-name { font-weight: 700; font-size: .98rem; letter-spacing: .02em; color: var(--text-strong); }
.brand-accent { color: var(--accent); }
.brand-sub { font-size: .66rem; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; }

.nav { flex: 1; overflow-y: auto; padding: 4px 10px 8px; }
.nav-label { display:block; font-size: .62rem; text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted); padding: 14px 10px 6px; }

.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; margin: 1px 0;
  border: none; background: transparent; border-radius: 9px;
  font-size: .85rem; font-weight: 500; color: var(--text-soft); text-align: left;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--hover); color: var(--text-strong); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-ico { width: 20px; height: 20px; display: grid; place-items: center; flex-shrink: 0; }
.nav-item.active .nav-ico { color: var(--accent); }

.nav-bottom { padding: 4px 10px 10px; border-top: 1px solid var(--border); }

.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.privacy-pill { display: inline-flex; align-items: center; gap: 7px; font-size: .72rem; color: var(--text-soft); background: var(--hover); padding: 5px 10px; border-radius: 999px; }
.privacy-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.privacy-pill.remote .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.version { font-size: .68rem; color: var(--text-muted); }

/* ---------- Topbar ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px; border-bottom: 1px solid var(--border);
  background: var(--bg-raise);
  position: sticky; top: 0; z-index: 30;
}
.menu-btn { display: none; }

.search-wrap { position: relative; flex: 1; max-width: 460px; }
.search-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
#globalSearchInput {
  width: 100%; padding: 9px 14px 9px 38px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg-input); font-size: .86rem;
  transition: border-color .15s, box-shadow .15s;
}
#globalSearchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }

.search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg-raise); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; max-height: 380px; overflow-y: auto; z-index: 100; }
.search-result-item { display: flex; gap: 10px; padding: 10px 14px; cursor: pointer; align-items: center; border-bottom: 1px solid var(--border-soft); }
.search-result-item:hover { background: var(--hover); }
.search-result-item:last-child { border-bottom: none; }
.sr-kind { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); width: 84px; flex-shrink: 0; }
.sr-title { font-size: .86rem; font-weight: 500; color: var(--text-strong); }
.sr-sub { font-size: .76rem; color: var(--text-muted); }
.sr-empty { padding: 16px; text-align: center; color: var(--text-muted); font-size: .85rem; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.context-select { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-input); }
.ctx-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.context-select select { border: none; background: transparent; font-size: .84rem; font-weight: 500; color: var(--text-strong); padding: 3px 2px; cursor: pointer; }
.context-select select:focus { outline: none; }

.icon-btn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text-soft); display: grid; place-items: center; transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--hover); color: var(--text-strong); }
.badge-dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-raise); }

.user-menu-btn { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-input); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: .8rem; font-weight: 600; }
.user-name { font-size: .82rem; font-weight: 500; color: var(--text-strong); }

/* ---------- Quick add ---------- */
.quick-add { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--border-soft); background: var(--bg); overflow-x: auto; }
.qa-label { font-size: .64rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-right: 2px; white-space: nowrap; }
.chip { border: 1px solid var(--border); background: var(--bg-raise); color: var(--text-soft); font-size: .78rem; font-weight: 500; padding: 5px 12px; border-radius: 999px; white-space: nowrap; transition: border-color .15s, background .15s, color .15s; }
.chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ---------- Content ---------- */
.content { flex: 1; overflow-y: auto; padding: 22px 24px 80px; }
.view { max-width: 1180px; margin: 0 auto; animation: fadein .22s var(--ease); }
@keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none;} }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-title { font-size: 1.5rem; font-weight: 700; }
.page-desc { color: var(--text-soft); font-size: .9rem; max-width: 640px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.section-gap { margin-bottom: 18px; }
.hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
.muted { color: var(--text-muted); font-size: .85rem; }
.strong { font-weight: 600; color: var(--text-strong); }

/* ---------- Scrollbars ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; scroll-behavior: auto !important; }
}

/* theme toggle icons */
.theme-moon { display: none; }
[data-theme="dark"] .theme-sun { display: none; }
[data-theme="dark"] .theme-moon { display: block; }
@media (prefers-color-scheme: dark) {
  [data-theme="system"] .theme-sun { display: none; }
  [data-theme="system"] .theme-moon { display: block; }
}

/* Transmission state banner */
.transmission-banner { padding: 8px 18px; font-size: .78rem; font-weight: 600; background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--border); }

/* Skeleton loading states */
.skeleton { background: linear-gradient(90deg, var(--border-soft) 25%, var(--hover) 50%, var(--border-soft) 75%); background-size: 200% 100%; border-radius: 6px; animation: sk 1.2s ease-in-out infinite; }
@keyframes sk { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

/* Collapsible nav groups */
.nav .nav-label[data-navgroup] { cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: none; font-size: .62rem; text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted); padding: 14px 10px 6px; }
.nav .nav-label[data-navgroup]:hover { color: var(--text-soft); }
.nav .nav-label[data-navgroup]::after { content: "▾"; font-size: .6rem; transition: transform .2s var(--ease); }
.nav .nav-label[data-navgroup].collapsed::after { transform: rotate(-90deg); }
.nav .navgroup.collapsed { display: none; }

/* Floating +Log button (mobile quick capture) */
.fab { display: none; position: fixed; right: 18px; bottom: 84px; z-index: 60; width: 56px; height: 56px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); align-items: center; justify-content: center; }
.fab:hover { filter: brightness(1.08); }
@media (max-width: 720px) { .fab { display: flex; } }

/* ============================================================
   PERSONA AI — components.css
   ============================================================ */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
.card + .card, .grid > .card { margin: 0; }
.card-title { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title .ctl { font-size: .78rem; text-transform: none; letter-spacing: 0; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-raise); color: var(--text-strong); font-size: .85rem; font-weight: 600; transition: all .15s; }
.btn:hover { border-color: var(--text-muted); background: var(--hover); }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; box-shadow: var(--shadow-sm); }
.btn-primary:hover { filter: brightness(1.05); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-soft); }
.btn-ghost:hover { background: var(--hover); }
.btn-danger { color: var(--bad); border-color: var(--bad-soft); background: transparent; }
.btn-danger:hover { background: var(--bad-soft); }
.btn-sm { padding: 6px 11px; font-size: .78rem; border-radius: 8px; }
.btn-lg { padding: 12px 20px; font-size: .95rem; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.icon-btn-sm { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-soft); display: grid; place-items: center; }
.icon-btn-sm:hover { background: var(--hover); color: var(--text-strong); }

/* ---------- Badges / confidence ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; line-height: 1.4; }
.badge-low { background: var(--neutral-soft); color: var(--text-soft); }
.badge-moderate { background: var(--warn-soft); color: var(--warn); }
.badge-high { background: var(--ok-soft); color: var(--ok); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-bad { background: var(--bad-soft); color: var(--bad); }
.badge-neutral { background: var(--neutral-soft); color: var(--text-soft); }
.badge-accent { background: var(--accent-soft); color: var(--accent); }

/* confidence pill with word + level bar */
.conf { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 600; color: var(--text-soft); }
.conf .bar { width: 34px; height: 4px; border-radius: 999px; background: var(--border); overflow: hidden; }
.conf .bar i { display: block; height: 100%; border-radius: 999px; }

/* ---------- Tags / chips ---------- */
.tag { display: inline-flex; align-items: center; font-size: .74rem; font-weight: 500; padding: 3px 9px; border-radius: 7px; background: var(--hover); color: var(--text-soft); border: 1px solid transparent; }
.tag-accent { background: var(--accent-soft); color: var(--accent); }
.tag-input-wrap { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-input); min-height: 42px; align-items: center; }
.tag-input { border: none; background: transparent; flex: 1; min-width: 120px; padding: 4px; font-size: .85rem; }
.tag-input:focus { outline: none; }
.tag-remove { background: none; border: none; color: inherit; padding: 0 0 0 4px; cursor: pointer; font-size: .8rem; opacity: .7; }

/* ---------- Metric cards ---------- */
.metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.metric-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s; }
.metric-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.metric-label { font-size: .76rem; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; }
.metric-value { font-size: 1.7rem; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1; }
.metric-value small { font-size: .8rem; color: var(--text-muted); font-weight: 500; }
.metric-sub { font-size: .76rem; color: var(--text-soft); margin-top: 6px; }
.metric-trend { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; }

.trend-up { color: var(--ok); }
.trend-down { color: var(--bad); }
.trend-flat { color: var(--text-muted); }
.trend-unknown { color: var(--text-muted); }

/* ---------- Grids ---------- */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-stats { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

/* ---------- Lists ---------- */
.list { display: flex; flex-direction: column; }
.list-item { padding: 12px 0; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; gap: 12px; }
.list-item:last-child { border-bottom: none; }
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
table.data-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.data-table th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--bg-raise); position: sticky; top: 0; white-space: nowrap; }
.data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background: var(--hover); }
.data-table .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* ---------- Person cards ---------- */
.person-card { cursor: pointer; }
.person-card .avatar-lg { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 1rem; }
.person-name { font-weight: 600; color: var(--text-strong); font-size: .95rem; }
.person-meta { font-size: .78rem; color: var(--text-muted); }
.person-stats { display: flex; gap: 12px; margin-top: 10px; font-size: .76rem; color: var(--text-soft); flex-wrap: wrap; }

/* ---------- Insight cards ---------- */
.insight-card { border-left: 3px solid var(--neutral); }
.insight-pattern { border-left-color: var(--info); }
.insight-change { border-left-color: var(--warn); }
.insight-prediction { border-left-color: var(--accent); }
.insight-gap { border-left-color: var(--neutral); }
.insight-alert { border-left-color: var(--warn); }
.insight-tag { font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--text-muted); }
.insight-body { font-size: .92rem; color: var(--text-strong); margin: 6px 0; line-height: 1.5; }
.insight-meta { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0; font-size: .76rem; color: var(--text-muted); }
.insight-meta span { display: inline-flex; align-items: center; gap: 5px; }
.insight-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.link-btn { background: none; border: none; color: var(--accent); font-size: .8rem; font-weight: 600; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.link-btn:hover { background: var(--accent-soft); }

/* ---------- Timeline ---------- */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding: 0 0 18px 12px; }
.tl-item::before { content: ""; position: absolute; left: -18px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg-raise); border: 2px solid var(--accent); }
.tl-item.warn::before { border-color: var(--warn); }
.tl-item.ok::before { border-color: var(--ok); }
.tl-date { font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
.tl-title { font-weight: 600; color: var(--text-strong); font-size: .9rem; }
.tl-body { font-size: .86rem; color: var(--text-soft); margin-top: 2px; }
.tl-tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Evidence list ---------- */
.evidence-list { display: flex; flex-direction: column; gap: 6px; }
.ev { display: flex; gap: 9px; align-items: flex-start; font-size: .85rem; padding: 8px 10px; border-radius: 8px; background: var(--bg-raise); border: 1px solid var(--border-soft); }
.ev .ev-mark { width: 18px; flex-shrink: 0; font-weight: 700; text-align: center; }
.ev-support { border-left: 3px solid var(--ok); } .ev-support .ev-mark { color: var(--ok); }
.ev-counter { border-left: 3px solid var(--bad); } .ev-counter .ev-mark { color: var(--bad); }
.ev-neutral { border-left: 3px solid var(--neutral); } .ev-neutral .ev-mark { color: var(--neutral); }
.ev .ev-text { flex: 1; }
.ev .ev-date { color: var(--text-muted); font-size: .76rem; white-space: nowrap; }

/* ---------- Analysis blocks ---------- */
.analysis { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.analysis > .ana-head { padding: 12px 16px; background: var(--bg-raise); border-bottom: 1px solid var(--border); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; }
.analysis > .ana-body { padding: 16px; }
.ana-block { margin-bottom: 14px; }
.ana-block:last-child { margin-bottom: 0; }
.ana-block .ab-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
.ana-block p { margin: 0; font-size: .9rem; color: var(--text); }

.stat-pill { display: inline-flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--text-strong); background: var(--bg-raise); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; }
.stat-pill b { font-size: 1rem; }

/* ---------- Bar / progress ---------- */
.progress { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 999px; }
.bar-track { display: flex; align-items: center; gap: 10px; }
.bar-track .progress { flex: 1; }
.bar-label { font-size: .8rem; color: var(--text-soft); width: 130px; }
.bar-val { font-size: .8rem; font-weight: 600; color: var(--text-strong); width: 46px; text-align: right; font-variant-numeric: tabular-nums; }

/* balance comparison */
.balance-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 10px; }
.balance-col { text-align: center; }
.balance-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

/* ---------- Empty states ---------- */
.empty { text-align: center; padding: 44px 20px; }
.empty .empty-ico { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px; display: grid; place-items: center; background: var(--hover); color: var(--text-muted); }
.empty h3 { color: var(--text-strong); margin-bottom: 6px; }
.empty p { color: var(--text-muted); max-width: 420px; margin: 0 auto 16px; font-size: .9rem; }
.empty .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* ---------- Forms ---------- */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: .78rem; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
.field .req { color: var(--bad); }
.input, .select, .textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg-input); font-size: .88rem; transition: border-color .15s, box-shadow .15s;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.textarea { resize: vertical; min-height: 84px; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 16px; }
.form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
.hint { font-size: .76rem; color: var(--text-muted); margin-top: 4px; }

.check { display: flex; gap: 9px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-raise); cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.check .ch-label { font-size: .86rem; font-weight: 500; color: var(--text-strong); }
.check .ch-sub { font-size: .76rem; color: var(--text-muted); }
.check:hover { border-color: var(--text-muted); }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-input); overflow: hidden; flex-wrap: wrap; }
.seg button { border: none; background: transparent; padding: 8px 14px; font-size: .82rem; font-weight: 500; color: var(--text-soft); }
.seg button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button:hover { background: var(--hover); }

/* ---------- Modal ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(16,24,40,.45); backdrop-filter: blur(2px); z-index: 200; display: grid; place-items: center; padding: 20px; animation: fadein .15s; }
.modal { width: 100%; max-width: 640px; max-height: 88vh; display: flex; flex-direction: column; background: var(--bg-raise); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .18s var(--ease); }
.modal-lg { max-width: 840px; }
@keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 1.05rem; font-weight: 600; color: var(--text-strong); }
.modal-sub { font-size: .8rem; color: var(--text-muted); margin-top: 2px; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tab { padding: 9px 14px; border: none; background: transparent; color: var(--text-soft); font-size: .86rem; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--text-strong); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* ---------- Toast ---------- */
.toast-root { position: fixed; bottom: 20px; right: 20px; z-index: 400; display: flex; flex-direction: column; gap: 10px; max-width: 380px; }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: var(--bg-raise); border: 1px solid var(--border); border-left: 3px solid var(--info); border-radius: 12px; box-shadow: var(--shadow-lg); animation: slidein .2s var(--ease); font-size: .86rem; }
.toast.ok { border-left-color: var(--ok); }
.toast.warn { border-left-color: var(--warn); }
.toast.bad { border-left-color: var(--bad); }
.toast .t-ico { margin-top: 1px; }
.toast-close { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: .9rem; }
@keyframes slidein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Tooltip ---------- */
[data-tip] { position: relative; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--tooltip-bg); color: var(--tooltip-text); font-size: .74rem; padding: 6px 10px; border-radius: 7px; white-space: nowrap; z-index: 300; box-shadow: var(--shadow-md); pointer-events: none; }

/* ---------- Charts ---------- */
.chart-wrap { width: 100%; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .76rem; color: var(--text-soft); margin-top: 10px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-dot { width: 9px; height: 9px; border-radius: 3px; }
.chart-tip { font-size: .72rem; color: var(--text-muted); margin-top: 6px; }

/* ---------- Filters ---------- */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.filter-bar .select, .filter-bar .input { width: auto; min-width: 140px; padding: 8px 10px; font-size: .82rem; }

/* ---------- Notification panel ---------- */
.notif-panel { position: absolute; top: calc(100% + 8px); right: 0; width: 340px; background: var(--bg-raise); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); z-index: 300; overflow: hidden; }
.notif-item { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); font-size: .85rem; color: var(--text); cursor: pointer; }
.notif-item:hover { background: var(--hover); }
.notif-item:last-child { border-bottom: none; }
.notif-item .n-kind { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-weight: 600; }

/* ---------- Guardrail callout ---------- */
.guardrail { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--neutral-soft); border: 1px solid var(--border); font-size: .84rem; color: var(--text-soft); }
.guardrail strong { color: var(--text-strong); }

/* ---------- Word vs action ---------- */
.wva-item { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); margin-bottom: 10px; }
.wva-state { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }

/* ---------- Network ---------- */
.network-wrap { display: flex; justify-content: center; padding: 10px 0; }

/* ---------- Tag select grid ---------- */
.tag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.tag-opt { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; padding: 7px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg-raise); cursor: pointer; color: var(--text-soft); font-weight: 500; }
.tag-opt:hover { border-color: var(--text-muted); }
.tag-opt.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ---------- Stat header ---------- */
.person-header { display: flex; gap: 18px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.person-header .avatar-xl { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.5rem; }
.person-header .ph-name { font-size: 1.4rem; font-weight: 700; }
.person-header .ph-sub { color: var(--text-muted); font-size: .88rem; }

.kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.kpi { background: var(--bg-raise); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.kpi .k-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
.kpi .k-val { font-size: 1.3rem; font-weight: 700; color: var(--text-strong); }
.kpi .k-sub { font-size: .74rem; color: var(--text-soft); }

/* ---------- Indicator score ---------- */
.indicator { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 13px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
.indicator .in-name { font-weight: 600; color: var(--text-strong); font-size: .9rem; }
.indicator .in-score { font-weight: 700; font-size: 1.1rem; color: var(--text-strong); }
.indicator .in-meta { grid-column: 1 / -1; font-size: .74rem; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* demo badge */
.demo-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: .84rem; font-weight: 500; border: 1px solid var(--accent); margin-bottom: 16px; }

.qa-input-wrap { display: flex; gap: 8px; align-items: center; }
.qa-input { flex: 1; }

/* ============================================================
   PERSONA AI — themes.css (design tokens, light/dark/system)
   ============================================================ */
:root {
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'Spline Sans Mono', 'SF Mono', Menlo, Consolas, monospace;
  --fs: 15px;

  --ease: cubic-bezier(.2,.8,.25,1);
  --sidebar-w: 244px;
  --radius: 14px;
  --radius-sm: 9px;

  --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
  --shadow-md: 0 4px 16px rgba(16,24,40,.08);
  --shadow-lg: 0 12px 40px rgba(16,24,40,.14);

  --ok: #12b76a;   --ok-soft: rgba(18,183,106,.14);
  --warn: #f79009; --warn-soft: rgba(247,144,9,.15);
  --bad: #f04438;  --bad-soft: rgba(240,68,56,.13);
  --info: #2e90fa; --info-soft: rgba(46,144,250,.14);
  --neutral: #98a2b3; --neutral-soft: rgba(152,162,179,.18);
}

[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7f9;
  --bg-raise: #ffffff;
  --bg-input: #ffffff;
  --sidebar-bg: #fbfbfc;
  --text: #344054;
  --text-strong: #101828;
  --text-soft: #667085;
  --text-muted: #98a2b3;
  --border: #e4e7ec;
  --border-soft: #eef0f4;
  --hover: #f1f2f5;
  --code-bg: #f2f4f7;
  --scroll: #d0d5dd;
  --scroll-hover: #98a2b3;
  --accent: #7a5af8;
  --accent-2: #5b8def;
  --accent-soft: rgba(122,90,248,.11);
  --card: #ffffff;
  --tooltip-bg: #101828;
  --tooltip-text: #fff;
  --chart-grid: #e9ebf0;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1116;
  --bg-raise: #151a22;
  --bg-input: #1a2029;
  --sidebar-bg: #0f1319;
  --text: #cbd2dd;
  --text-strong: #eef1f6;
  --text-soft: #9aa4b2;
  --text-muted: #6b7684;
  --border: #262c36;
  --border-soft: #1f252e;
  --hover: #1c222c;
  --code-bg: #1c222c;
  --scroll: #333c49;
  --scroll-hover: #4a5563;
  --accent: #9b84ff;
  --accent-2: #6f9dff;
  --accent-soft: rgba(155,132,255,.14);
  --card: #151a22;
  --tooltip-bg: #eef1f6;
  --tooltip-text: #101828;
  --chart-grid: #232a34;
}

[data-theme="system"] {
  --bg: #f6f7f9; --bg-raise: #ffffff; --bg-input: #ffffff; --sidebar-bg: #fbfbfc;
  --text: #344054; --text-strong: #101828; --text-soft: #667085; --text-muted: #98a2b3;
  --border: #e4e7ec; --border-soft: #eef0f4; --hover: #f1f2f5; --code-bg: #f2f4f7;
  --scroll: #d0d5dd; --scroll-hover: #98a2b3; --card: #ffffff;
  --tooltip-bg: #101828; --tooltip-text: #fff; --chart-grid: #e9ebf0;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  [data-theme="system"] {
    color-scheme: dark;
    --bg: #0e1116; --bg-raise: #151a22; --bg-input: #1a2029; --sidebar-bg: #0f1319;
    --text: #cbd2dd; --text-strong: #eef1f6; --text-soft: #9aa4b2; --text-muted: #6b7684;
    --border: #262c36; --border-soft: #1f252e; --hover: #1c222c; --code-bg: #1c222c;
    --scroll: #333c49; --scroll-hover: #4a5563; --card: #151a22;
    --tooltip-bg: #eef1f6; --tooltip-text: #101828; --chart-grid: #232a34;
  }
}

/* ============================================================
   PERSONA AI — responsive.css
   ============================================================ */
@media (max-width: 1080px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .form-grid-3 { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 900px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: translateX(0); }
  .menu-btn { display: grid; }
  .user-name { display: none; }
  .ctx-label { display: none; }
}

@media (max-width: 720px) {
  .content { padding: 16px 14px 110px; }
  .grid-2, .grid-3, .grid-4, .form-grid, .form-grid-3 { grid-template-columns: 1fr; }
  .metric-grid { grid-template-columns: repeat(2, 1fr); }
  .topbar { padding: 10px 12px; flex-wrap: wrap; }
  .search-wrap { order: 3; flex-basis: 100%; max-width: none; }
  .page-head { flex-direction: column; align-items: flex-start; }
  .kpi-strip { grid-template-columns: repeat(2, 1fr); }
  .balance-cols { grid-template-columns: 1fr; }
  .qa-input-wrap { flex-direction: column; align-items: stretch; }
}

@media (max-width: 480px) {
  .metric-grid { grid-template-columns: 1fr 1fr; }
  .quick-add { padding: 10px 12px; }
  .toast-root { left: 12px; right: 12px; max-width: none; }
  .notif-panel { width: calc(100vw - 24px); }
}

/* ---------- Mobile bottom navigation ---------- */
.mobile-nav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg-raise); border-top: 1px solid var(--border); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); justify-content: space-around; }
.mnav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-muted); font-size: .66rem; font-weight: 500; padding: 5px 10px; border-radius: 9px; }
.mnav-item .mnav-ico { color: var(--text-muted); }
.mnav-item.active { color: var(--accent); }
.mnav-item.active .mnav-ico { color: var(--accent); }
.mnav-item:hover { background: var(--hover); }
@media (max-width: 720px) {
  .mobile-nav { display: flex; }
  .content { padding-bottom: 76px; }
}

</style>

  function networkView(net) {

    const angle = (i) => i / Math.max(1, n) * Math.PI * 2 - Math.PI / 2;
    const pos = net.nodes.map((nd, i) => ({ ...nd, x: cx + Math.cos(angle(i)) * Math.min(190, 80 + n * 12), y: cy + Math.sin(angle(i)) * Math.min(90, 50 + n * 6) }));
    const maxCount = Math.max(...net.links.map((l) => l.count), 1);
    const links = pos.map((nd) => {
      const link = net.links.find((l) => l.personId === nd.id);
      const count = link ? link.count : 0;
      const width = 1 + count / maxCount * 5;
      return `<line x1="${cx}" y1="${cy}" x2="${nd.x}" y2="${nd.y}" stroke="var(--accent)" stroke-width="${width.toFixed(1)}" opacity="0.5"><title>${esc2(nd.name)}: ${count} interactions</title></line>`;
    }).join("");
    const nodes = pos.map((nd) => `<circle cx="${nd.x}" cy="${nd.y}" r="${10 + nd.interactions / Math.max(1, maxCount) * 4}" fill="${colorFor(nd.name)}" opacity="0.9"><title>${esc2(nd.name)} \u2014 ${nd.interactions} interactions</title></circle><text x="${nd.x}" y="${nd.y + 26}" text-anchor="middle" font-size="11" fill="var(--text-soft)">${esc2(nd.name)}</text>`).join("");
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:auto;display:block" role="img" aria-label="Social network based on recorded interactions">${links}${nodes}</svg>`;
  }

  function bindTagGroup() {
    root().querySelectorAll("[data-taggroup]").forEach((g) => {
      const id = g.getAttribute("data-taggroup");
      const getVals = () => [...g.querySelectorAll("[data-tagopt].on")].map((b) => b.getAttribute("data-tagopt"));
      g.querySelectorAll("[data-tagopt]").forEach((b) => b.addEventListener("click", () => b.classList.toggle("on")));
      const input = g.querySelector("[data-customtag]");
      if (input) input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const v = input.value.trim();
          if (v && !getVals().includes(v)) {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "tag-opt on";
            chip.setAttribute("data-tagopt", v);
            chip.setAttribute("data-group", id);
            chip.textContent = v;

            g.insertBefore(chip, input);
          }
          input.value = "";
        }
      });
    });
  }
