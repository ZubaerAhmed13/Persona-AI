name: Persona live Pages smoke

on:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/live-pages-smoke.yml
      - scripts/live-pages-smoke.mjs

permissions:
  contents: read

jobs:
  live-pages-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'gh-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout live verification harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate live smoke harness on pull requests
        if: github.event_name == 'pull_request'
        run: node --check scripts/live-pages-smoke.mjs

      - name: Identify current certified main artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "PERSONA_EXPECTED_BLOB_SHA=$(git hash-object index.html)" >> "$GITHUB_ENV"
          echo "PERSONA_EXPECTED_BYTES=$(wc -c < index.html | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "PERSONA_EXPECTED_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" >> "$GITHUB_ENV"
          echo "Live smoke checks certified main bytes rather than a stale release-specific hash."

      - name: Open deployed Persona AI in real Chrome
        if: github.event_name != 'pull_request'
        env:
          PERSONA_LIVE_URL: https://zubaerahmed13.github.io/Persona-AI/
        run: node scripts/live-pages-smoke.mjs
