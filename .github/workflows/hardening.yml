name: Persona hardening verification

on:
  push:
    branches:
      - main
      - 'hardening/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build hardened self-contained application
        run: npm run build

      - name: Require committed production bundle on main and PR
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html does not match the production artifact generated from this exact commit. Run npm run build and commit index.html before merging or pushing to main."
            git diff --stat -- index.html
            exit 1
          fi
          echo "Committed index.html exactly matches the artifact generated from certified SHA $(git rev-parse HEAD)."

      - name: Run security and regression tests
        run: npm test

      - name: Verify production artifact
        run: npm run verify

      - name: Browser acceptance — direct file and HTTP hosted
        shell: bash
        run: |
          npm run test:browser && exit 0
          echo "First browser-smoke attempt failed; retrying once to tolerate hosted-runner Chrome startup flake."
          sleep 2
          npm run test:browser

      - name: Complete product/backup/AI browser acceptance
        run: npm run test:acceptance

      - name: Major feature workflow browser acceptance
        run: npm run test:features

      - name: Commit generated index.html when changed on hardening branches
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already matches the hardened source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: generate Persona AI v3.1.1 hardened bundle [skip ci]"
          git push
