name: Temporary acceptance diagnostics

on:
  push:
    branches:
      - hardening/v3.1.1-complete-acceptance

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build production bundle
        run: npm run build
      - name: Run diagnostic browser acceptance
        run: node scripts/diagnose-full-acceptance.mjs
